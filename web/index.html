<!DOCTYPE html>

<body>
<div id="loading">
  <p id="loadMsg">Initialising WASM…</p>
  <progress id="loadBar" value="0" max="100"></progress>
</div>
<canvas id="canvas"></canvas>
<div id="ui">
  <div id="ctrl-posing"></div>
  <div id="ctrl-head"></div>
  <div id="ctrl-body"></div>
</div>
<div id="status"></div>

<script src="js/wasm/riglogic_wasm.js"></script>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.133.0';
import { OrbitControls } from 'https://esm.sh/three@0.133.0/examples/jsm/controls/OrbitControls.js';
import { TransformControls } from 'https://esm.sh/three@0.133.0/examples/jsm/controls/TransformControls.js';

// ════════════════════════════════════════════════════════════
//  CONFIG
// ════════════════════════════════════════════════════════════
const CHARACTER_DIR = 'metahuman/bazeel';
const DNA_HEAD = `${CHARACTER_DIR}/head.dna`;
const DNA_BODY = `${CHARACTER_DIR}/body.dna`;
const MAPS_DIR = `${CHARACTER_DIR}/Maps`;
const LOD      = 0;
// Geometry (positions, deltas) is in metres — C++ converted at load time.
// Joint output deltas are in centimetres; neutral translations are also in centimetres.
const CM = 0.01;

// ════════════════════════════════════════════════════════════
//  HELPERS
// ════════════════════════════════════════════════════════════
const loadMsg  = document.getElementById('loadMsg');
const loadBar  = document.getElementById('loadBar');
const statusEl = document.getElementById('status');
const setMsg    = (msg, pct) => { loadMsg.textContent = msg; if (pct != null) loadBar.value = pct; console.log(msg); };
const setStatus = t => statusEl.textContent = t;

// ════════════════════════════════════════════════════════════
//  WAIT FOR WASM
// ════════════════════════════════════════════════════════════
setMsg('Loading WASM module…', 5);
const RL = await new Promise(res => RigLogicModule().then(res));

// ════════════════════════════════════════════════════════════
//  CWRAP ALL EXPORTS
// ════════════════════════════════════════════════════════════
const w = (n, ret, args) => RL.cwrap(n, ret, args);

const rl_create    = w('rl_create',    'number', ['number','number']);
const rl_destroy   = w('rl_destroy',   null,     ['number']);
const rl_set_lod   = w('rl_set_lod',   null,     ['number','number']);

// 9 args: handle, guiPtr, guiCount, jntPtr, jntFloatCount,
//         blendPtr, blendCount, wrinklePtr, wrinkleCount
const rl_evaluate_gui = w('rl_evaluate_gui', null, [
  'number','number','number',
  'number','number',
  'number','number',
  'number','number'
]);

// Split GUI evaluation: rl_set_gui_controls (setGUIControl + mapGUIToRawControls)
// then, after any rl_set_raw_control driver-bone writes, rl_calculate_and_get_outputs
// (calculate + copy outputs). mapGUIToRawControls zeroes the whole GUI-mapped raw
// range, so driver-bone raw controls MUST be set between these two calls, never before.
const rl_set_gui_controls = w('rl_set_gui_controls', null, ['number','number','number']);
const rl_calculate_and_get_outputs = w('rl_calculate_and_get_outputs', null, [
  'number',
  'number','number',
  'number','number',
  'number','number'
]);

const rl_get_gui_control_count        = w('rl_get_gui_control_count',        'number', ['number']);
const rl_get_gui_control_min           = w('rl_get_gui_control_min',           'number', ['number','number']);
const rl_get_gui_control_max           = w('rl_get_gui_control_max',           'number', ['number','number']);
const rl_get_neutral_joint_translations = w('rl_get_neutral_joint_translations', null, ['number','number','number']);
const rl_get_neutral_joint_rotations    = w('rl_get_neutral_joint_rotations',    null, ['number','number','number']);
const rl_get_joint_count              = w('rl_get_joint_count',              'number', ['number']);
const rl_get_joint_output_float_count = w('rl_get_joint_output_float_count', 'number', ['number']);
const rl_get_blend_count              = w('rl_get_blend_count',              'number', ['number']);
const rl_get_wrinkle_count            = w('rl_get_wrinkle_count',            'number', ['number']);
const rl_get_animated_map_count       = w('rl_get_animated_map_count',       'number', ['number']);
const rl_get_mesh_count               = w('rl_get_mesh_count',               'number', ['number']);
const rl_get_raw_control_count        = w('rl_get_raw_control_count',        'number', ['number']);

const rl_get_joint_name               = w('rl_get_joint_name',               'number', ['number','number']);
const rl_get_joint_parent_index       = w('rl_get_joint_parent_index',       'number', ['number','number']);
const rl_get_gui_control_name         = w('rl_get_gui_control_name',         'number', ['number','number']);
const rl_get_raw_control_name         = w('rl_get_raw_control_name',         'number', ['number','number']);
const rl_get_animated_map_name        = w('rl_get_animated_map_name',        'number', ['number','number']);
const rl_get_mesh_name                = w('rl_get_mesh_name',                'number', ['number','number']);

// Posing: driven-joint classification + raw-control (driver bone) writes.
const rl_get_driven_joint_count       = w('rl_get_driven_joint_count',       'number', ['number']);
const rl_get_driven_joint_indices     = w('rl_get_driven_joint_indices',     null,     ['number','number','number']);
const rl_set_raw_control              = w('rl_set_raw_control',              null,     ['number','number','number']);
const rl_get_mesh_vertex_count        = w('rl_get_mesh_vertex_count',        'number', ['number','number']);
const rl_get_mesh_index_count         = w('rl_get_mesh_index_count',         'number', ['number','number']);
const rl_get_mesh_max_influences      = w('rl_get_mesh_max_influences',      'number', ['number','number']);
const rl_get_mesh_blend_shape_count   = w('rl_get_mesh_blend_shape_count',   'number', ['number','number']);
const rl_get_mesh_blend_shape_channel_index =
  w('rl_get_mesh_blend_shape_channel_index', 'number', ['number','number','number']);

// 4 args: handle, meshIndex, outPtr, elementCount
const rl_get_mesh_positions          = w('rl_get_mesh_positions',          null, ['number','number','number','number']);
const rl_get_mesh_uvs                = w('rl_get_mesh_uvs',                null, ['number','number','number','number']);
const rl_get_mesh_normals            = w('rl_get_mesh_normals',            null, ['number','number','number','number']);
const rl_get_mesh_indices            = w('rl_get_mesh_indices',            null, ['number','number','number','number']);
const rl_get_mesh_skin_weights       = w('rl_get_mesh_skin_weights',       null, ['number','number','number','number']);
const rl_get_mesh_skin_joint_indices = w('rl_get_mesh_skin_joint_indices', null, ['number','number','number','number']);

// 5 args: handle, meshIndex, bsIndex, outPtr, elementCount
const rl_get_mesh_blend_shape_deltas = w('rl_get_mesh_blend_shape_deltas', null, ['number','number','number','number','number']);

// ════════════════════════════════════════════════════════════
//  DNA FILE LOADER
// ════════════════════════════════════════════════════════════
async function fetchToWasm(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status} loading ${url}`);
  const bytes = new Uint8Array(await res.arrayBuffer());
  const ptr   = RL._malloc(bytes.byteLength);
  RL.HEAPU8.set(bytes, ptr);
  return { ptr, size: bytes.byteLength };
}

// ════════════════════════════════════════════════════════════
//  MATERIALS / TEXTURES
// ════════════════════════════════════════════════════════════
// Loads the character's ExportManifest.json (lists available Maps/*.png)
// once at startup. Falls back to flat placeholder colors per mesh when a
// manifest, or a specific map within it, isn't available.
let manifestFiles = new Set();
try {
  const res = await fetch(`${CHARACTER_DIR}/ExportManifest.json`);
  if (res.ok) {
    const manifest = await res.json();
    for (const f of manifest.files?.maps || []) manifestFiles.add(f);
  }
} catch (err) {
  console.warn('No ExportManifest.json found; using flat placeholder materials.', err);
}

const textureLoader = new THREE.TextureLoader();
const textureCache = new Map();
function loadMapTexture(filename, { srgb = false } = {}) {
  if (!manifestFiles.has(filename)) return null;
  if (textureCache.has(filename)) return textureCache.get(filename);
  const tex = textureLoader.load(`${MAPS_DIR}/${filename}`);
  // The bridge already V-flips UVs for WebGL (DNA UVs are top-origin);
  // flipping again here would undo that correction.
  tex.flipY = false;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.encoding = srgb ? THREE.sRGBEncoding : THREE.LinearEncoding;
  textureCache.set(filename, tex);
  return tex;
}

// Per-mesh manifest map filenames, matching the DNA's fixed LOD0 mesh names.
// Verified directly against the addon's real shader graph (character_dna/
// resources/blends/materials.blend, head_shader/body_shader materials' own
// Principled BSDF node), via the Wine/Blender pipeline -- not guessed:
//   Metallic = 0.0 (constant, NOT texture-driven -- SRMF is never wired to
//     the Metallic input in the real graph at all)
//   Roughness = 0.5 (constant, NOT texture-driven either)
//   Specular IOR Level = 0.001 (near-zero -- almost no specular highlight)
//   Subsurface Weight = 0.0 (SSS is present on the BSDF but weighted off,
//     so no subsurface approximation is needed to match this look)
// The previous code fed the SRMF texture into roughnessMap/metalnessMap,
// which the real shader never does -- that was making skin look shiny/
// plasticky wherever that texture's channels happened to be bright. SRMF is
// intentionally unused here now, matching Blender's actual material exactly.
// Per-mesh roughness/metalness/specular/coat values below are read directly
// off each material's own Principled BSDF in materials.blend (eyeLeft_shader/
// eyeRight_shader/teeth_shader/eyelashes_shader), same verification method
// as the head/body values above. Eyes use a clearcoat layer (Coat Weight
// 0.25) for the wet corneal look -- MeshStandardMaterial has no clearcoat
// slot, so those use MeshPhysicalMaterial instead.
const MESH_TEXTURE_SETS = {
  head_lod0_mesh:      { base: 'Head_Basecolor.png', normal: 'Head_Normal.png', roughness: 0.5, metalness: 0.0 },
  body_lod0_mesh:       { base: 'Body_Basecolor.png', normal: 'Body_Normal.png', roughness: 0.5, metalness: 0.0 },
  teeth_lod0_mesh:      { base: 'Teeth_Color.png', normal: 'Teeth_Normal.png', roughness: 0.05, metalness: 0.0 },
  eyeLeft_lod0_mesh:    { base: 'Eyes_Color.png', normal: 'Eyes_Normal.png', roughness: 0.0, metalness: 0.0, clearcoat: 0.25 },
  eyeRight_lod0_mesh:   { base: 'Eyes_Color.png', normal: 'Eyes_Normal.png', roughness: 0.0, metalness: 0.0, clearcoat: 0.25 },
  eyelashes_lod0_mesh:  { base: 'Eyelashes_Color.png', alphaFromBase: true, roughness: 0.19, metalness: 0.0 },
};

function buildMaterial(meshName) {
  const set = MESH_TEXTURE_SETS[meshName];
  const baseTex = set?.base ? loadMapTexture(set.base, { srgb: true }) : null;
  if (set && baseTex) {
    const opts = {
      map: baseTex,
      side: THREE.DoubleSide,
      roughness: set.roughness,
      metalness: set.metalness,
      // MeshStandardMaterial has no direct "specular IOR level" slot; the
      // closest available knob is envMapIntensity, kept low since the real
      // material's specular contribution is near-zero for skin/eyes.
      envMapIntensity: 0.1,
    };
    const normalTex = set.normal ? loadMapTexture(set.normal) : null;
    if (normalTex) opts.normalMap = normalTex;
    if (set.alphaFromBase) { opts.transparent = true; opts.alphaTest = 0.3; }
    if (set.clearcoat) {
      opts.clearcoat = set.clearcoat;
      opts.clearcoatRoughness = 0.0;
      return new THREE.MeshPhysicalMaterial(opts);
    }
    return new THREE.MeshStandardMaterial(opts);
  }

  // Fallback: flat placeholder colors (no manifest, or this mesh has no
  // corresponding map in it -- e.g. saliva/eyeshell/eyeEdge/cartilage).
  const nm = meshName.toLowerCase();
  if (nm.includes('teeth') || nm.includes('saliva')) {
    return new THREE.MeshStandardMaterial({ color: 0xeef0ee, roughness: 0.05, side: THREE.DoubleSide });
  } else if (nm.includes('lash')) {
    return new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.19, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
  } else if (nm.includes('eyeshell')) {
    // Cornea: must be near-transparent so the textured eyeLeft/eyeRight iris
    // mesh underneath shows through. An opaque fallback here was fully
    // occluding the eyes, rendering them flat white with no visible pupil.
    return new THREE.MeshStandardMaterial({
      color: 0xffffff, roughness: 0.05, metalness: 0.0,
      transparent: true, opacity: 0.12, side: THREE.DoubleSide, depthWrite: false,
    });
  } else if (nm.includes('eye') && !nm.includes('edge')) {
    return new THREE.MeshStandardMaterial({ color: 0x8090a0, roughness: 0.1, side: THREE.DoubleSide });
  } else if (nm.includes('cartilage')) {
    return new THREE.MeshStandardMaterial({ color: 0xffeecc, roughness: 0.5, side: THREE.DoubleSide, transparent: true, opacity: 0.4 });
  }
  return new THREE.MeshStandardMaterial({ color: 0xc8a478, roughness: 0.80, metalness: 0.0, side: THREE.DoubleSide });
}

// ════════════════════════════════════════════════════════════
//  ANIMATED WRINKLE / COLOR MASKS (head basecolor only)
// ════════════════════════════════════════════════════════════
// Blends RigLogic's per-expression animated-map outputs into the head's
// basecolor using the REAL per-region masks. These are not guessed: they
// were extracted by headlessly baking the actual materials.blend shader
// graph (37 named regions, e.g. "head_wm1_blink_L_msk") onto the real head
// mesh UVs via Blender-under-Wine (the addon's DNA/RigLogic bindings are
// Windows-only), then packed 4-per-texture into 10 RGBA atlases. The blend
// formula itself was read directly out of the node graph (MergeMaps.004):
//   Output = Base + Fac1*(CM1-Base) + Fac2*(CM2-Base) + Fac3*(CM3-Base)
// where each Fac_i is the sum, over that group's regions, of
// (region's live RigLogic scalar * region's baked mask sample). Regions
// named "*_wm13_*" feed both Fac1 and Fac3 (shared between groups 1 and 3
// in the original shader). Normal-map (wrinkle) blending uses the exact
// same MergeMaps formula and the exact same fac1/fac2/fac3 weights (verified
// via the real node graph, Wine/Blender: the "WrM1"/"WM2"/"WM3" mask groups
// feed a MergeMaps.004 instance for Normal exactly like CM1/2/3 do for Color),
// just with Head_Normal_Animated_WM1/2/3.png as Map1/2/3 instead of the CM
// basecolor maps.
const WRINKLE_DIR = `${CHARACTER_DIR}/Masks/wrinkle_atlas`;
const WRINKLE_ATLAS_COUNT = 10;
const WRINKLE_CHANNELS = ['r', 'g', 'b', 'a'];

async function setupWrinkleBlend(rig, mesh) {
  const material = mesh.material;
  if (!(material instanceof THREE.MeshStandardMaterial) || !material.map) return;

  let regionList;
  try {
    const res = await fetch(`${WRINKLE_DIR}/wrinkle_atlas_index.json`);
    if (!res.ok) return;
    regionList = await res.json(); // [{name, atlas: "wrinkle_atlas_N.png", channel}, ...]
  } catch (err) {
    console.warn('No wrinkle atlas index found; skipping animated wrinkle/color masks.', err);
    return;
  }

  const cm1 = loadMapTexture('Head_Basecolor_Animated_CM1.png', { srgb: true });
  const cm2 = loadMapTexture('Head_Basecolor_Animated_CM2.png', { srgb: true });
  const cm3 = loadMapTexture('Head_Basecolor_Animated_CM3.png', { srgb: true });
  if (!cm1 || !cm2 || !cm3) return; // manifest doesn't have the animated maps for this character

  // Normal-map (wrinkle) counterparts of CM1/2/3 -- optional; older manifests
  // may not have these, in which case only the color blend runs.
  const wm1 = loadMapTexture('Head_Normal_Animated_WM1.png');
  const wm2 = loadMapTexture('Head_Normal_Animated_WM2.png');
  const wm3 = loadMapTexture('Head_Normal_Animated_WM3.png');
  const hasWM = !!(wm1 && wm2 && wm3 && material.normalMap);

  const atlasTextures = [];
  for (let i = 0; i < WRINKLE_ATLAS_COUNT; i++) {
    const tex = textureLoader.load(`${WRINKLE_DIR}/wrinkle_atlas_${i}.png`);
    tex.flipY = false;
    tex.encoding = THREE.LinearEncoding;
    atlasTextures.push(tex);
  }

  // Match each region name to its live RigLogic animated-map output index
  // (rl_get_animated_map_name returns "{group}.{regionName}"; cm/wm variants
  // of the same region share one live value, so the first match wins).
  const { handle } = rig;
  const mapCount = rl_get_animated_map_count(handle);
  const wrinkleIndexByRegion = new Map();
  for (let i = 0; i < mapCount; i++) {
    const full = RL.UTF8ToString(rl_get_animated_map_name(handle, i));
    const dot = full.indexOf('.');
    // DNA animated-map names omit the "_msk" suffix that the baked mask
    // filenames/materials.blend interface sockets carry (e.g. DNA has
    // "head_wm1_blink_L", the mask is named "head_wm1_blink_L_msk").
    const regionName = (dot >= 0 ? full.slice(dot + 1) : full) + '_msk';
    if (!wrinkleIndexByRegion.has(regionName)) wrinkleIndexByRegion.set(regionName, i);
  }

  const resolved = regionList.map(r => ({
    name: r.name,
    channel: r.channel,
    atlasIndex: parseInt(r.atlas.match(/\d+/)[0], 10),
    wrinkleIdx: wrinkleIndexByRegion.get(r.name),
    groups: /_wm13_/.test(r.name) ? [1, 3]
          : /_wm1_/.test(r.name) ? [1]
          : /_wm2_/.test(r.name) ? [2]
          : /_wm3_/.test(r.name) ? [3] : [],
  }));
  const missing = resolved.filter(r => r.wrinkleIdx === undefined);
  if (missing.length > 0) {
    console.warn('Wrinkle regions with no matching RigLogic animated map (skipped):', missing.map(r => r.name));
  }

  const weights = new Float32Array(resolved.length);

  const sampleTerm = (i) => {
    const r = resolved[i];
    return `uMaskWeights[${i}] * texture2D(uWrinkleAtlas${r.atlasIndex}, vUv).${WRINKLE_CHANNELS[r.channel]}`;
  };
  const sumForGroup = (g) => {
    const terms = resolved.map((r, i) => r.groups.includes(g) ? sampleTerm(i) : null).filter(Boolean);
    return terms.length > 0 ? terms.join(' + ') : '0.0';
  };
  const fac1Expr = sumForGroup(1);
  const fac2Expr = sumForGroup(2);
  const fac3Expr = sumForGroup(3);

  material.onBeforeCompile = (shader) => {
    for (let i = 0; i < WRINKLE_ATLAS_COUNT; i++) {
      shader.uniforms[`uWrinkleAtlas${i}`] = { value: atlasTextures[i] };
    }
    shader.uniforms.uCM1 = { value: cm1 };
    shader.uniforms.uCM2 = { value: cm2 };
    shader.uniforms.uCM3 = { value: cm3 };
    shader.uniforms.uMaskWeights = { value: weights };

    const uniformDecls = Array.from({ length: WRINKLE_ATLAS_COUNT }, (_, i) => `uniform sampler2D uWrinkleAtlas${i};`).join('\n')
      + `\nuniform sampler2D uCM1;\nuniform sampler2D uCM2;\nuniform sampler2D uCM3;\nuniform float uMaskWeights[${resolved.length}];\n`
      + (hasWM ? `uniform sampler2D uWM1;\nuniform sampler2D uWM2;\nuniform sampler2D uWM3;\nvarying vec2 vWrinkleFacs;\n` : '');
    shader.fragmentShader = uniformDecls + shader.fragmentShader;

    // fac1/fac2/fac3 are needed in BOTH map_fragment (color) and
    // normal_fragment_maps (normal) chunks, which run at different points
    // in the fragment shader -- compute them once up top via a small helper
    // macro-like block inserted before both, so the expressions (built from
    // the live per-region RigLogic weights) aren't duplicated/desynced.
    const facBlock = `
      float wrFac1 = clamp(${fac1Expr}, 0.0, 1.0);
      float wrFac2 = clamp(${fac2Expr}, 0.0, 1.0);
      float wrFac3 = clamp(${fac3Expr}, 0.0, 1.0);
    `;

    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <map_fragment>',
      `#include <map_fragment>
      {
        ${facBlock}
        vec3 cm1c = texture2D(uCM1, vUv).rgb;
        vec3 cm2c = texture2D(uCM2, vUv).rgb;
        vec3 cm3c = texture2D(uCM3, vUv).rgb;
        diffuseColor.rgb += wrFac1 * (cm1c - diffuseColor.rgb)
                           + wrFac2 * (cm2c - diffuseColor.rgb)
                           + wrFac3 * (cm3c - diffuseColor.rgb);
      }`
    );

    if (hasWM) {
      shader.uniforms.uWM1 = { value: wm1 };
      shader.uniforms.uWM2 = { value: wm2 };
      shader.uniforms.uWM3 = { value: wm3 };
      // Same MergeMaps formula as color, applied to the raw (still encoded
      // 0..1) normal map texture BEFORE the *2.0-1.0 tangent-space decode --
      // matches the source shader graph, which blends the raw image colors
      // prior to any vector decoding.
      // Matches this Three.js version's real TANGENTSPACE_NORMALMAP branch
      // of normal_fragment_maps (read directly from THREE.ShaderChunk at
      // runtime, not assumed) -- only the mapN source changes, blending the
      // raw encoded normal texture before the *2.0-1.0 decode, same as the
      // color blend above and matching the source shader graph.
      shader.fragmentShader = shader.fragmentShader.replace(
        '#include <normal_fragment_maps>',
        `#ifdef OBJECTSPACE_NORMALMAP
          normal = texture2D( normalMap, vUv ).xyz * 2.0 - 1.0;
          #ifdef FLIP_SIDED
            normal = - normal;
          #endif
          #ifdef DOUBLE_SIDED
            normal = normal * faceDirection;
          #endif
          normal = normalize( normalMatrix * normal );
        #elif defined( TANGENTSPACE_NORMALMAP )
          ${facBlock}
          vec3 baseN = texture2D( normalMap, vUv ).rgb;
          vec3 wm1c = texture2D(uWM1, vUv).rgb;
          vec3 wm2c = texture2D(uWM2, vUv).rgb;
          vec3 wm3c = texture2D(uWM3, vUv).rgb;
          baseN += wrFac1 * (wm1c - baseN) + wrFac2 * (wm2c - baseN) + wrFac3 * (wm3c - baseN);
          vec3 mapN = baseN * 2.0 - 1.0;
          mapN.xy *= normalScale;
          #ifdef USE_TANGENT
            normal = normalize( vTBN * mapN );
          #else
            normal = perturbNormal2Arb( - vViewPosition, normal, mapN, faceDirection );
          #endif
        #elif defined( USE_BUMPMAP )
          normal = perturbNormalArb( - vViewPosition, normal, dHdxy_fwd(), faceDirection );
        #endif`
      );
    }
  };
  material.needsUpdate = true;

  rig.wrinkleBlend = { resolved, weights };
}

// Copies this frame's live RigLogic animated-map values into the shader's
// mask-weight uniform array (mutated in place; Three.js diffs array uniform
// contents by value, so no extra "needsUpdate" flag is required).
function updateWrinkleWeights(rig) {
  const wb = rig.wrinkleBlend;
  if (!wb) return;
  const view = rig.wrinkleView;
  for (let i = 0; i < wb.resolved.length; i++) {
    const idx = wb.resolved[i].wrinkleIdx;
    wb.weights[i] = idx !== undefined ? view[idx] : 0;
  }
}

// ════════════════════════════════════════════════════════════
//  BUILD RIG
// Welds vertices by rounded position and averages their normals in place,
// so UV-seam splits (independently-authored per-corner normals in the raw
// DNA mesh data) shade smoothly instead of showing a hard crease line.
// See the call site in buildRig's mesh loop for the full explanation.
function smoothNormalsAcrossSeams(pos, nrm, vertCount) {
  const EPS = 1e4; // position rounding: 1/EPS units
  const groups = new Map(); // "x,y,z" -> array of vertex indices
  for (let v = 0; v < vertCount; v++) {
    const x = Math.round(pos[v*3] * EPS);
    const y = Math.round(pos[v*3+1] * EPS);
    const z = Math.round(pos[v*3+2] * EPS);
    const key = `${x},${y},${z}`;
    let g = groups.get(key);
    if (!g) { g = []; groups.set(key, g); }
    g.push(v);
  }
  for (const g of groups.values()) {
    if (g.length < 2) continue;
    let sx = 0, sy = 0, sz = 0;
    for (const v of g) { sx += nrm[v*3]; sy += nrm[v*3+1]; sz += nrm[v*3+2]; }
    const len = Math.hypot(sx, sy, sz) || 1;
    sx /= len; sy /= len; sz /= len;
    for (const v of g) { nrm[v*3] = sx; nrm[v*3+1] = sy; nrm[v*3+2] = sz; }
  }
}

// ════════════════════════════════════════════════════════════
// mode 'facial': RigLogic drives virtually every joint (dense facial joint
//   behavior matrix); only driver bones (face-board inputs) are excluded.
//   Matches Blender's head_bone_transform_plan (skips only driver bones).
// mode 'skeletal': RigLogic only computes corrective outputs (RBF/twist/
//   swing); everything else is plain FK posed directly by the user and must
//   never be overwritten by a zero-delta evaluate() result. Matches
//   Blender's body_bone_transform_plan (driven ∪ swing ∪ twist bones only).
function buildRig(handle, label, mode) {
  rl_set_lod(handle, LOD);

  const jointCount   = rl_get_joint_count(handle);
  const floatCount   = rl_get_joint_output_float_count(handle);
  const blendCount   = rl_get_blend_count(handle);
  const wrinkleCount = rl_get_wrinkle_count(handle);
  const guiCount     = rl_get_gui_control_count(handle);
  const fpj          = Math.round(floatCount / jointCount);
  const hasScale     = (fpj >= 10);

  console.log(`${label}: jointCount=${jointCount} floatCount=${floatCount} fpj=${fpj} hasScale=${hasScale}`);

  // ── Persistent eval buffers ────────────────────────────────────────────
  const guiBuf     = new Float32Array(guiCount);
  const guiPtr     = RL._malloc(guiCount     * 4);
  const jntPtr     = RL._malloc(floatCount   * 4);
  const blendPtr   = RL._malloc(blendCount   * 4);
  const wrinklePtr = RL._malloc(wrinkleCount * 4);

  // ── Neutral definition-layer transforms ─────────────────────────────────
  // RigLogic joint outputs are deltas; the DNA neutral pose is the bind pose.
  // Copy these arrays immediately so later WASM mallocs cannot invalidate them.
  const ntPtr = RL._malloc(jointCount * 3 * 4);
  const nrPtr = RL._malloc(jointCount * 3 * 4);
  rl_get_neutral_joint_translations(handle, ntPtr, jointCount * 3);
  rl_get_neutral_joint_rotations(handle, nrPtr, jointCount * 3);

  const neutralT = new Float32Array(
    new Float32Array(RL.HEAPF32.buffer, ntPtr, jointCount * 3)
  );
  const neutralR = new Float32Array(
    new Float32Array(RL.HEAPF32.buffer, nrPtr, jointCount * 3)
  );
  RL._free(ntPtr);
  RL._free(nrPtr);

  const DEG = Math.PI / 180;
  const neutralQ = [];
  const e = new THREE.Euler();
  // DNA rotations are authored for Blender's mathutils.Euler((rx,ry,rz), "XYZ"),
  // which composes as R = Rz*Ry*Rx (intrinsic X-then-Y-then-Z, matrix product in
  // reverse). Three.js's OWN 'XYZ' order composes as R = Rx*Ry*Rz -- a DIFFERENT
  // rotation despite the identical order string. Verified numerically against a
  // real DNA joint's neutral rotation via the actual Blender addon (Wine): only
  // THREE.Euler order 'ZYX' reproduces Blender's matrix exactly (zero error);
  // 'XYZ' diverges completely for any multi-axis triple. This was invisible for
  // near-single-axis rotations (most body joints) but catastrophically wrong for
  // facial joints authored near the Y=90 deg gimbal region (e.g. FacialRoot,
  // causing the eye/jaw/mouth deformation and bind-mismatch bugs).
  for (let j = 0; j < jointCount; j++) {
    e.set(
      neutralR[j*3+0] * DEG,
      neutralR[j*3+1] * DEG,
      neutralR[j*3+2] * DEG,
      'ZYX'
    );
    neutralQ.push(new THREE.Quaternion().setFromEuler(e));
  }

  // Evaluate once so the output buffers are initialized.
  // All-zero GUI means zero delta, not an absolute zero transform.
  RL.HEAPF32.set(guiBuf, guiPtr >> 2);
  rl_evaluate_gui(handle, guiPtr, guiCount,
                  jntPtr,     floatCount,
                  blendPtr,   blendCount,
                  wrinklePtr, wrinkleCount);

  // Cache views after the initial allocations. refreshViews() repairs
  // them if the WASM heap grows later.
  const jntView     = new Float32Array(RL.HEAPF32.buffer, jntPtr,     floatCount);
  const blendView   = new Float32Array(RL.HEAPF32.buffer, blendPtr,   blendCount);
  const wrinkleView = new Float32Array(RL.HEAPF32.buffer, wrinklePtr, wrinkleCount);

  // ── 1. Local matrices from the DNA neutral bind pose ────────────────────
  const localMats = [];
  for (let j = 0; j < jointCount; j++) {
    const t = new THREE.Vector3(
      neutralT[j*3+0] * CM,
      neutralT[j*3+1] * CM,
      neutralT[j*3+2] * CM
    );
    localMats.push(new THREE.Matrix4().compose(
      t, neutralQ[j], new THREE.Vector3(1, 1, 1)
    ));
  }

  // ── 2. Accumulate to world space ──────────────────────────────────────
  const worldMats = new Array(jointCount);
  for (let j = 0; j < jointCount; j++) {
    const p = rl_get_joint_parent_index(handle, j);
    worldMats[j] = (p < 0)
      ? localMats[j].clone()
      : worldMats[p].clone().multiply(localMats[j]);
  }

  // ── 3. Bones + skeleton ───────────────────────────────────────────────
  const bones = [];
  for (let j = 0; j < jointCount; j++) {
    const bone = new THREE.Bone();
    bone.name = RL.UTF8ToString(rl_get_joint_name(handle, j));
    bone.userData.jointIndex = j;
    bones.push(bone);
  }
  for (let j = 0; j < jointCount; j++) {
    const p = rl_get_joint_parent_index(handle, j);
    if (p >= 0) bones[p].add(bones[j]);
  }

  // Bone local transforms are the neutral DNA transforms.
  for (let j = 0; j < jointCount; j++) {
    bones[j].position.set(
      neutralT[j*3+0] * CM,
      neutralT[j*3+1] * CM,
      neutralT[j*3+2] * CM
    );
    bones[j].quaternion.copy(neutralQ[j]);
    bones[j].scale.set(1, 1, 1);
  }

  const boneInverses = worldMats.map(m => m.clone().invert());
  const skeleton = new THREE.Skeleton(bones, boneInverses);

  const boneByName = new Map();
  for (const b of bones) boneByName.set(b.name, b);

  // ── Driven-joint classification ─────────────────────────────────────────
  // Only these joints receive RigLogic's evaluate() output (RBF/twist/swing
  // corrective transforms). All other joints are posed directly (driver
  // bones) or stay at the neutral rest pose.
  const drivenCount = rl_get_driven_joint_count(handle);
  const drivenJointSet = new Set();
  if (drivenCount > 0) {
    const dPtr = RL._malloc(drivenCount * 4);
    rl_get_driven_joint_indices(handle, dPtr, drivenCount);
    const rawDriven = new Uint32Array(RL.HEAPU8.buffer, dPtr, drivenCount);
    for (let i = 0; i < drivenCount; i++) drivenJointSet.add(rawDriven[i]);
    RL._free(dPtr);
  }

  // ── Driver-bone raw-control indices ─────────────────────────────────────
  // Raw controls named "BoneName.qx/qy/qz/qw" are driven directly by a
  // pose-bone's local quaternion (FK posing), mirroring Blender's
  // head_raw_quat_plan / body_raw_plan. Grouped by bone name -> {x,y,z,w: rawIndex}.
  const rawControlCount = rl_get_raw_control_count(handle);
  const driverBoneRawIndices = new Map();
  for (let i = 0; i < rawControlCount; i++) {
    const full = RL.UTF8ToString(rl_get_raw_control_name(handle, i));
    const dot = full.lastIndexOf('.');
    if (dot < 0) continue;
    const boneName = full.slice(0, dot);
    const axisTag = full.slice(dot + 1);
    if (!axisTag.startsWith('q')) continue;
    const axis = axisTag.slice(1);
    if (axis !== 'x' && axis !== 'y' && axis !== 'z' && axis !== 'w') continue;
    let entry = driverBoneRawIndices.get(boneName);
    if (!entry) { entry = {}; driverBoneRawIndices.set(boneName, entry); }
    entry[axis] = i;
  }

  // ── Which joints evaluate() is allowed to overwrite ─────────────────────
  let applyJointSet;
  if (mode === 'facial') {
    applyJointSet = new Set();
    for (let j = 0; j < jointCount; j++) {
      const bone = bones[j];
      if (!driverBoneRawIndices.has(bone.name)) applyJointSet.add(j);
    }
  } else {
    applyJointSet = drivenJointSet;
  }

  // ── 4. Meshes ──────────────────────────────────────────────────────────
  const meshCount = rl_get_mesh_count(handle);
  const group = new THREE.Group();
  group.name = label;
  const channelMaps = [];

  for (let mi = 0; mi < meshCount; mi++) {
    const vertCount = rl_get_mesh_vertex_count(handle, mi);
    if (vertCount === 0) { channelMaps.push([]); continue; }

    const idxCount = rl_get_mesh_index_count(handle, mi);
    const maxInfl = rl_get_mesh_max_influences(handle, mi);
    const bsCount = rl_get_mesh_blend_shape_count(handle, mi);
    const meshName = RL.UTF8ToString(rl_get_mesh_name(handle, mi));

    // Allocate all WASM buffers before creating any typed-array views.
    const posPtr = RL._malloc(vertCount * 3 * 4);
    const uvPtr  = RL._malloc(vertCount * 2 * 4);
    const nrmPtr = RL._malloc(vertCount * 3 * 4);
    const idxPtr = RL._malloc(idxCount * 4);
    const swPtr  = RL._malloc(vertCount * maxInfl * 4);
    const siPtr  = RL._malloc(vertCount * maxInfl * 2);

    rl_get_mesh_positions(handle, mi, posPtr, vertCount * 3);
    rl_get_mesh_uvs(handle, mi, uvPtr, vertCount * 2);
    rl_get_mesh_normals(handle, mi, nrmPtr, vertCount * 3);
    rl_get_mesh_indices(handle, mi, idxPtr, idxCount);
    rl_get_mesh_skin_weights(handle, mi, swPtr, vertCount * maxInfl);
    rl_get_mesh_skin_joint_indices(handle, mi, siPtr, vertCount * maxInfl);

    const rawPos = new Float32Array(RL.HEAPF32.buffer, posPtr, vertCount * 3);
    const rawUV  = new Float32Array(RL.HEAPF32.buffer, uvPtr, vertCount * 2);
    const rawNrm = new Float32Array(RL.HEAPF32.buffer, nrmPtr, vertCount * 3);
    const rawIdx = new Uint32Array(RL.HEAPU8.buffer, idxPtr, idxCount);
    const rawSW  = new Float32Array(RL.HEAPF32.buffer, swPtr, vertCount * maxInfl);
    const rawSI  = new Uint16Array(RL.HEAPU8.buffer, siPtr, vertCount * maxInfl);

    const pos = new Float32Array(rawPos);
    const uv = new Float32Array(rawUV);
    const nrm = new Float32Array(rawNrm);
    const idx = new Uint32Array(idxCount);
    for (let i = 0; i < idxCount; i++) idx[i] = rawIdx[i];

    // Smooth normals across UV-seam vertex splits. The DNA mesh format
    // stores per-corner ("layout") vertices split at every UV seam (needed
    // since a GPU vertex can only carry one UV), and each split copy keeps
    // its own independently-authored normal -- these are NOT guaranteed to
    // match across the seam. Blender's importer welds by position into its
    // own vertex/loop model and shades smoothly across seams; this renderer
    // was using the raw per-corner normals as-is, producing a visible hard
    // shading crease along seams (e.g. the tank-top/skin boundary at the
    // underarm) regardless of lighting -- confirmed not a lighting issue
    // since it persists under any light direction, and confirmed not a
    // topology bug since welded vertex/edge counts match Blender exactly.
    // Fix: weld by rounded position and average normals within each group.
    smoothNormalsAcrossSeams(pos, nrm, vertCount);

    const skinW = new Float32Array(vertCount * 4);
    const skinI = new Uint16Array(vertCount * 4);
    // DNA vertices can carry more than 4 influences (MetaHuman corrective
    // rigs commonly use 5-8 for good joint deformation); Three.js's
    // skinIndex/skinWeight attributes are hardcoded to 4 components. The
    // previous code took influences [0..3] in raw DNA order and dropped the
    // rest -- correct ONLY if that order happens to already be weight-
    // descending, which is not guaranteed. If a dominant influence (e.g.
    // the primary joint driving a bend) landed at slot 4+, it was silently
    // discarded while small/irrelevant ones got kept and renormalized up to
    // fill the gap, producing wrong deformation exactly at complex joints
    // (elbows, shoulders, hips) -- matching the reported "skeletal
    // deformation breaking the mesh a bit" while the overall pose/range was
    // otherwise correct. Fix: sort each vertex's influences by weight
    // descending and keep the top 4, so the dominant bones are never
    // dropped regardless of the DNA's raw storage order.
    const infl = new Array(maxInfl);
    for (let v = 0; v < vertCount; v++) {
      for (let k = 0; k < maxInfl; k++) {
        infl[k] = { w: rawSW[v * maxInfl + k], i: rawSI[v * maxInfl + k] };
      }
      infl.sort((a, b) => b.w - a.w);
      let sum = 0;
      const cap = Math.min(maxInfl, 4);
      for (let k = 0; k < cap; k++) {
        skinW[v * 4 + k] = infl[k].w;
        skinI[v * 4 + k] = infl[k].i;
        sum += infl[k].w;
      }
      if (sum > 1e-6 && Math.abs(sum - 1) > 1e-4) {
        for (let k = 0; k < 4; k++) skinW[v * 4 + k] /= sum;
      }
    }

    RL._free(posPtr); RL._free(uvPtr); RL._free(nrmPtr);
    RL._free(idxPtr); RL._free(swPtr); RL._free(siPtr);

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    geo.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
    geo.setAttribute('skinWeight', new THREE.BufferAttribute(skinW, 4));
    geo.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(skinI, 4));
    geo.setIndex(new THREE.BufferAttribute(idx, 1));

    const chMap = [];
    if (bsCount > 0) {
      geo.morphTargetsRelative = true;
      const morphPos = [];
      for (let bs = 0; bs < bsCount; bs++) {
        const dPtr = RL._malloc(vertCount * 3 * 4);
        rl_get_mesh_blend_shape_deltas(handle, mi, bs, dPtr, vertCount * 3);
        const rawD = new Float32Array(RL.HEAPF32.buffer, dPtr, vertCount * 3);
        morphPos.push(new THREE.BufferAttribute(new Float32Array(rawD), 3));
        RL._free(dPtr);
        chMap.push(rl_get_mesh_blend_shape_channel_index(handle, mi, bs));
      }
      geo.morphAttributes.position = morphPos;
    }
    channelMaps.push(chMap);

    const mat = buildMaterial(meshName);

    const mesh = new THREE.SkinnedMesh(geo, mat);
    mesh.name = meshName;
    mesh.frustumCulled = false;
    mesh.userData.channelMapIndex = mi;

    // Explicit identity bind matrix: the skeleton is in world space.
    mesh.bind(skeleton, new THREE.Matrix4());

    if (bsCount > 0) {
      mesh.morphTargetInfluences = new Array(bsCount).fill(0);
      mesh.updateMorphTargets();
    }
    group.add(mesh);
  }

  return {
    handle, label, group, skeleton,
    rootBone: bones[0], bones, boneByName,
    channelMaps,
    guiBuf, guiPtr, jntPtr, blendPtr, wrinklePtr,
    neutralT, neutralR, neutralQ,
    jntView, blendView, wrinkleView,
    guiCount, jointCount, floatCount, blendCount, wrinkleCount, fpj, hasScale,
    applyJointSet, driverBoneRawIndices,
    // Driver bones the user has posed this session; their live bone
    // quaternion is pushed into raw controls every evaluate() call.
    posedDriverBones: new Set(),
  };
}

// Pushes every posed driver bone's current local quaternion into its
// RigLogic raw-control indices. Call before rl_evaluate_gui so the pose is
// included in the same calculate() pass.
const _deltaQ = new THREE.Quaternion();
function pushDriverPoses(rig) {
  const { handle, driverBoneRawIndices, boneByName, posedDriverBones, neutralQ } = rig;
  for (const boneName of posedDriverBones) {
    const bone = boneByName.get(boneName);
    const idx = driverBoneRawIndices.get(boneName);
    if (!bone || !idx) continue;
    // RigLogic raw controls expect the bone's rotation DELTA from its rest
    // pose (Blender's matrix_basis = restLocal^-1 * currentLocal), not the
    // bone's absolute local quaternion. bone.quaternion here is
    // neutralQ * userDelta (rotateZ etc. post-multiply onto the rest
    // quaternion), so we must strip the rest component back out.
    const j = bone.userData.jointIndex;
    _deltaQ.copy(neutralQ[j]).invert().multiply(bone.quaternion);
    if (idx.x !== undefined) rl_set_raw_control(handle, idx.x, _deltaQ.x);
    if (idx.y !== undefined) rl_set_raw_control(handle, idx.y, _deltaQ.y);
    if (idx.z !== undefined) rl_set_raw_control(handle, idx.z, _deltaQ.z);
    if (idx.w !== undefined) rl_set_raw_control(handle, idx.w, _deltaQ.w);
  }
}

// Marks a bone as user-posed (its quaternion becomes a RigLogic raw-control
// input from now on) and requests re-evaluation. Bones with no matching
// driver-bone raw controls (plain FK bones with no corrective solver reading
// them) are still posable but never write into RigLogic.
function markBonePosed(rig, boneName) {
  rig.posedDriverBones.add(boneName);
  dirty = true;
}

// ════════════════════════════════════════════════════════════
//  EVALUATE + APPLY
// ════════════════════════════════════════════════════════════
function refreshViews(rig) {
  // Emscripten may replace the HEAP buffers when WASM memory grows.
  // Recreate only the small JS view wrappers; the underlying pointers remain valid.
  if (rig.jntView.buffer !== RL.HEAPF32.buffer) {
    rig.jntView = new Float32Array(RL.HEAPF32.buffer, rig.jntPtr, rig.floatCount);
    rig.blendView = new Float32Array(RL.HEAPF32.buffer, rig.blendPtr, rig.blendCount);
    rig.wrinkleView = new Float32Array(RL.HEAPF32.buffer, rig.wrinklePtr, rig.wrinkleCount);
  }
}

// ── Eye aim ──────────────────────────────────────────────────────────────
// Ports rig_instance.py's get_head_gui_control_values_from_eye_aim exactly:
// for each eye, build a "reference frame" from the eye's REST local
// orientation composed onto its parent's CURRENT (posed) world matrix (so
// the eyes keep aiming at a world-fixed target even as the head turns),
// convert the world-space look vector into that reference frame, and derive
// yaw/pitch normalized by the same 60deg/30deg max-rotation constants the
// addon uses. Writes straight into guiBuf's L_eye/R_eye tx/ty slots.
const _eyeAimM4 = new THREE.Matrix4();
const _eyeAimM3 = new THREE.Matrix3();
const _eyeAimRestLocal = new THREE.Matrix4();
const _eyeAimEyePos = new THREE.Vector3();
const _eyeAimLookDir = new THREE.Vector3();
const _eyeAimLocalDir = new THREE.Vector3();
function applyEyeAim(rig) {
  const target = rig.eyeAimTarget;
  if (!target || !target.visible) return;
  const { guiBuf, neutralT, neutralQ } = rig;
  const targetPos = target.getWorldPosition(new THREE.Vector3());

  for (const [eyeBoneName, controlKey] of [['FACIAL_L_Eye', 'L|eye'], ['FACIAL_R_Eye', 'R|eye']]) {
    const eye = rig.boneByName.get(eyeBoneName);
    const idx = rig.eyeAimGuiIndices && rig.eyeAimGuiIndices.get(controlKey);
    if (!eye || !idx) continue;

    const j = eye.userData.jointIndex;
    _eyeAimRestLocal.compose(
      new THREE.Vector3(neutralT[j*3], neutralT[j*3+1], neutralT[j*3+2]),
      neutralQ[j], new THREE.Vector3(1, 1, 1)
    );
    const parent = eye.parent;
    if (parent) {
      _eyeAimM4.multiplyMatrices(parent.matrixWorld, _eyeAimRestLocal);
    } else {
      _eyeAimM4.copy(_eyeAimRestLocal);
    }
    eye.getWorldPosition(_eyeAimEyePos);
    _eyeAimLookDir.subVectors(targetPos, _eyeAimEyePos);
    if (_eyeAimLookDir.lengthSq() < 1e-10) continue;
    _eyeAimLookDir.normalize();

    _eyeAimM3.setFromMatrix4(_eyeAimM4).invert();
    _eyeAimLocalDir.copy(_eyeAimLookDir).applyMatrix3(_eyeAimM3).normalize();

    const horizDist = Math.hypot(_eyeAimLocalDir.x, _eyeAimLocalDir.z);
    const yaw = horizDist > 1e-7 ? Math.asin(Math.max(-1, Math.min(1, _eyeAimLocalDir.x / horizDist))) : 0;
    const pitch = Math.atan2(_eyeAimLocalDir.y, horizDist);
    const xMax = 60 * Math.PI / 180, yMax = 30 * Math.PI / 180;
    const xControl = Math.max(-1, Math.min(1, yaw / xMax));
    const yControl = Math.max(-1, Math.min(1, pitch / yMax));

    if (idx.txIndex !== undefined) guiBuf[idx.txIndex] = Math.max(idx.txMin, Math.min(idx.txMax, xControl));
    if (idx.tyIndex !== undefined) guiBuf[idx.tyIndex] = Math.max(idx.tyMin, Math.min(idx.tyMax, yControl));
  }
}

function evaluate(rig) {
  const { handle, guiBuf, guiPtr, jntPtr, blendPtr, wrinklePtr,
          guiCount, floatCount, blendCount, wrinkleCount,
          fpj, hasScale, bones, group, channelMaps,
          neutralT, neutralQ, applyJointSet } = rig;

  refreshViews(rig);
  applyEyeAim(rig);

  // Order matters: rl_set_gui_controls's mapGUIToRawControls() zeroes the
  // entire GUI-mapped raw-control range, so driver-bone raw-control writes
  // (pushDriverPoses) MUST happen after it and before calculate.
  RL.HEAPF32.set(guiBuf, guiPtr >> 2);
  rl_set_gui_controls(handle, guiPtr, guiCount);

  // Driver-bone poses (direct FK, set via markBonePosed) become raw-control
  // inputs for this evaluation pass.
  pushDriverPoses(rig);

  rl_calculate_and_get_outputs(handle,
                  jntPtr, floatCount,
                  blendPtr, blendCount,
                  wrinklePtr, wrinkleCount);

  // RigLogic joint outputs are deltas relative to the DNA neutral pose, and
  // are only applied to applyJointSet (see buildRig's 'facial'/'skeletal'
  // mode). Every other joint is either a driver bone (posed directly, see
  // pushDriverPoses/markBonePosed) or -- for skeletal rigs -- a plain FK
  // bone with no corrective solver, and must be left untouched here or its
  // user-authored pose (or neutral rest pose) would be overwritten.
  // Translation = neutral + delta, rotation = neutral * delta, scale = 1 + delta.
  const jnt = rig.jntView;
  const qd = new THREE.Quaternion();

  // RigLogic can output a degenerate (NaN) delta for a joint with no
  // meaningfully defined behavior (confirmed on real DNA: correctiveRoot
  // helper bones like upperarm_correctiveRoot_l/thigh_correctiveRoot_l).
  // NaN fails every numeric comparison, so a plain "< 1e-8" guard silently
  // lets it through, and multiplyQuaternions then propagates the NaN to
  // every bone in that joint's subtree -- which is what was making whole
  // limb segments (the RBF corrective bones actually holding that region's
  // skin weight) disappear from the render. Guard every component.
  const finiteOr0 = (v) => (Number.isFinite(v) ? v : 0);

  for (const i of applyJointSet) {
    const b = i * fpj;

    bones[i].position.set(
      (neutralT[i*3+0] + finiteOr0(jnt[b+0])) * CM,
      (neutralT[i*3+1] + finiteOr0(jnt[b+1])) * CM,
      (neutralT[i*3+2] + finiteOr0(jnt[b+2])) * CM
    );

    qd.set(jnt[b+3], jnt[b+4], jnt[b+5], jnt[b+6]);
    if (!(qd.lengthSq() >= 1e-8)) qd.identity(); // catches both near-zero AND NaN
    bones[i].quaternion.multiplyQuaternions(neutralQ[i], qd);

    if (hasScale) {
      bones[i].scale.set(
        1 + finiteOr0(jnt[b+7]),
        1 + finiteOr0(jnt[b+8]),
        1 + finiteOr0(jnt[b+9])
      );
    } else {
      bones[i].scale.set(1, 1, 1);
    }
  }

  // Apply blend shape weights — no allocation
  const bld = rig.blendView;
  for (const mesh of group.children) {
    if (!mesh.isMesh || !mesh.morphTargetInfluences) continue;
    const chMap = channelMaps[mesh.userData.channelMapIndex];
    if (!chMap) continue;
    for (let bs = 0; bs < chMap.length; bs++) {
      const gc = chMap[bs];
      mesh.morphTargetInfluences[bs] = gc < blendCount ? bld[gc] : 0;
    }
  }

  updateWrinkleWeights(rig);
}

// ── Head-to-body linkage ────────────────────────────────────────────────
// head.dna carries its own redundant copy of the shared upper-body chain
// (spine_04 up through neck_01/neck_02/head, plus the clavicle/upperarm
// branches) purely so its own RBF/corrective system has something to read
// -- confirmed by inspecting the real rig in Blender (headlessly, via the
// actual addon under Wine): every one of these ~27 bones shared by name
// between head_rig and body_rig carries its own individual Copy Transforms
// bone constraint (target = the same-named body_rig bone, influence 1.0).
// It is NOT a single "copy the root" constraint -- an earlier version of
// this code did that (copying only spine_04) and it visibly broke alignment
// (rotated/detached head), because spine_04 in head.dna already sits at
// (almost exactly) the same neutral position as body.dna's spine_04 -- the
// two DNA files share one coordinate frame natively, so overwriting it was
// actively wrong, not merely redundant. What actually needs syncing is
// every shared bone's transform, which matters once the body is posed away
// from neutral (e.g. rotating an arm), and critically because neck_01/
// neck_02/head are also head.dna's only three raw-control driver bones
// (see driverBoneRawIndices) -- so this sync is what feeds head's own
// eye-look/neck RBF correctives from the body's actual neck orientation,
// not just cosmetic bone-position bookkeeping.
const HEAD_BODY_SHARED_BONES = Array.from(headRig.boneByName.keys())
  .filter(name => bodyRig.boneByName.has(name));
if (HEAD_BODY_SHARED_BONES.length === 0) {
  console.warn('No bones shared by name between head and body rigs; head will not follow body.');
}
// Sort parents before children (within head's own hierarchy) so each
// bone's parent has an up-to-date matrixWorld by the time it's processed.
function boneDepth(bone) {
  let d = 0, b = bone;
  while (b.parent && b.parent.isBone) { d++; b = b.parent; }
  return d;
}
HEAD_BODY_SHARED_BONES.sort((a, b) =>
  boneDepth(headRig.boneByName.get(a)) - boneDepth(headRig.boneByName.get(b))
);
window.HEAD_BODY_SHARED_BONES = HEAD_BODY_SHARED_BONES;

const _syncMatrix = new THREE.Matrix4();
function syncHeadToBody() {
  for (const name of HEAD_BODY_SHARED_BONES) {
    const headBone = headRig.boneByName.get(name);
    const bodyBone = bodyRig.boneByName.get(name);
    bodyBone.updateWorldMatrix(true, false);

    const parent = headBone.parent;
    if (parent && parent.isBone) {
      parent.updateWorldMatrix(true, false);
      _syncMatrix.copy(parent.matrixWorld).invert().multiply(bodyBone.matrixWorld);
    } else {
      _syncMatrix.copy(bodyBone.matrixWorld);
    }
    _syncMatrix.decompose(headBone.position, headBone.quaternion, headBone.scale);
    headBone.updateMatrixWorld(false);
  }
}

// ════════════════════════════════════════════════════════════
//  BONE POSING (driver bones only — rotate gizmo + bone list)
// ════════════════════════════════════════════════════════════
// Only driver bones (rig.driverBoneRawIndices) are posable: they're the only
// joints whose rotation feeds RigLogic as a raw-control input (see
// pushDriverPoses). Driven/corrective joints are never user-selectable since
// RigLogic overwrites them every evaluate() call.
const HANDLE_COLOR = 0x33ccff;
const HANDLE_COLOR_SELECTED = 0xffaa00;
const handleGeo = new THREE.SphereGeometry(0.014, 8, 6);
const pickables = []; // meshes with userData.rig / userData.boneName

function addPosingHandles(rig) {
  for (const boneName of rig.driverBoneRawIndices.keys()) {
    const bone = rig.boneByName.get(boneName);
    if (!bone) continue;
    const mat = new THREE.MeshBasicMaterial({
      color: HANDLE_COLOR, depthTest: false, transparent: true, opacity: 0.85,
    });
    const handle = new THREE.Mesh(handleGeo, mat);
    handle.renderOrder = 999;
    handle.userData.rig = rig;
    handle.userData.boneName = boneName;
    bone.add(handle);
    pickables.push(handle);
  }
}
addPosingHandles(headRig);
addPosingHandles(bodyRig);

const transformControls = new TransformControls(camera, renderer.domElement);
transformControls.setMode('rotate');
transformControls.setSpace('local');
transformControls.size = 0.6;
scene.add(transformControls);

// Dragging the gizmo must not also orbit the camera.
transformControls.addEventListener('dragging-changed', (e) => {
  orbit.enabled = !e.value;
});

// TransformControls in rotate mode writes straight into the target object's
// (the driver bone's) quaternion, which is exactly the raw-control input
// pushDriverPoses reads every evaluate() call.
transformControls.addEventListener('change', () => {
  if (selection) {
    markBonePosed(selection.rig, selection.boneName);
  }
});

let selection = null; // { rig, boneName, bone, handle }

function findHandle(rig, boneName) {
  return pickables.find(p => p.userData.rig === rig && p.userData.boneName === boneName);
}

function selectBone(rig, boneName) {
  const bone = rig.boneByName.get(boneName);
  if (!bone) return;

  if (selection && selection.handle) selection.handle.material.color.setHex(HANDLE_COLOR);
  const handle = findHandle(rig, boneName);
  if (handle) handle.material.color.setHex(HANDLE_COLOR_SELECTED);

  selection = { rig, boneName, bone, handle };
  transformControls.attach(bone);
  updateBoneListSelection();
}

const raycaster = new THREE.Raycaster();
renderer.domElement.addEventListener('pointerdown', (event) => {
  // Ignore clicks that are dragging the gizmo itself.
  if (transformControls.dragging) return;
  const rect = renderer.domElement.getBoundingClientRect();
  const mouse = new THREE.Vector2(
    ((event.clientX - rect.left) / rect.width) * 2 - 1,
    -((event.clientY - rect.top) / rect.height) * 2 + 1
  );
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  if (hits.length > 0) {
    const h = hits[0].object;
    selectBone(h.userData.rig, h.userData.boneName);
  }
});

// ── Side-panel bone list ────────────────────────────────────────────────
// Fingers are a few millimetres across on screen and unreliable to click in

const boneListButtons = []; // { rig, boneName, el }

function buildBoneList(rig, title, container) {
  const h = document.createElement('h3');

  container.appendChild(h);

  wrap.className = 'bone-list';
  for (const boneName of rig.driverBoneRawIndices.keys()) {
    const btn = document.createElement('button');
    btn.className = 'bone-btn';
    btn.textContent = boneName;
    btn.addEventListener('click', () => selectBone(rig, boneName));
    wrap.appendChild(btn);
    boneListButtons.push({ rig, boneName, el: btn });
  }
  container.appendChild(wrap);
}

function updateBoneListSelection() {
  for (const { rig, boneName, el } of boneListButtons) {
    const isSelected = !!selection && selection.rig === rig && selection.boneName === boneName;
    el.classList.toggle('selected', isSelected);

}

function buildPosingUI() {
  const container = document.getElementById('ctrl-posing');

  container.appendChild(hint);

// ════════════════════════════════════════════════════════════
//  FACE BOARD — 2D control layout mirroring the DNA's native paired tx/ty
//  control scheme (CTRL_L_brow_down.ty, CTRL_C_mouth.tx/.ty, etc.), matching
//  Blender's face_board concept instead of a flat alphabetical slider list.
// ════════════════════════════════════════════════════════════
// All control positions/labels come from faceboard_layout.json, extracted
// directly from the LIVE character_dna addon's runtime face board (via Wine
// + the real Windows Blender build + an actual head.dna import): each
// CTRL_<side>_<name> pose bone was posed to (0,0,0) ["rest"] and then to its
// most extreme LIMIT_LOCATION value ["final"] (all 4 corners of the min/max
// box, for 2D controls), and its evaluated world (X, Z) position -- the
// board's real horizontal/vertical layout plane, Y is depth -- was read back
// and normalized into 0..100 (x) / 0..100 (y) space. Since each bone's
// location is constrained linearly, interpolating between "rest" and
// "final" (or between the 4 corners, for 2D controls) exactly reproduces
// the real board -- no guessed offsets or hand-tuned zones. Edit the JSON
// directly to tweak layout, or regenerate it (see wine_extract_true_extents.py
// referenced in project notes) if a different DNA/face-board revision
// changes control names.
const FACEBOARD_LAYOUT = await fetch('faceboard_layout.json').then(r => r.json());

// Linear position for a 1D control at a given raw value: "rest" is the
// board position at value=0 (bone location (0,0,0)); "final" is the
// position at value=entry.finalValue (the bone's most extreme
// LIMIT_LOCATION value). Bone location is a linear function of the control
// value, so this interpolation (and extrapolation, if value/finalValue ever
// exceeds 1) is exact, not approximated.
function faceboardPos1D(entry, value) {
  const t = entry.finalValue !== 0 ? value / entry.finalValue : 0;
  return {
    x: entry.rest.x + t * (entry.final.x - entry.rest.x),
    y: entry.rest.y + t * (entry.final.y - entry.rest.y),
  };
}

// Bilinear position for a 2D control from its 4 extracted corner positions.
// Every real face-board box turns out axis-aligned in screen space (verified
// against all 13 2D controls in faceboard_layout.json), so this reduces to
// independent per-axis linear interpolation.
function faceboardPos2D(entry, tx, ty) {
  const fx = entry.maxX > entry.minX ? (tx - entry.minX) / (entry.maxX - entry.minX) : 0;
  const fy = entry.maxY > entry.minY ? (ty - entry.minY) / (entry.maxY - entry.minY) : 0;
  const { minmin, maxmin, minmax } = entry.corners;
  return {
    x: minmin.x + fx * (maxmin.x - minmin.x),
    y: minmin.y + fy * (minmax.y - minmin.y),
  };
}


// "CTRL_L_brow_down.ty" -> { side: 'L', base: 'brow_down', axis: 'ty' }
// "CTRL_neck_throatUpDown.ty" -> { side: null, base: 'neck_throatUpDown', axis: 'ty' }
function splitGuiControlName(fullName) {
  const dot = fullName.lastIndexOf('.');
  const name = dot >= 0 ? fullName.slice(0, dot) : fullName;
  const axis = dot >= 0 ? fullName.slice(dot + 1) : '';
  const m = name.match(/^CTRL_(?:([LRC])_)?(.+)$/);
  if (!m) return { side: null, base: name, axis };
  return { side: m[1] || null, base: m[2], axis };
}

// Native look-at/convergence switches this viewer replaces with its own
// draggable eye-aim target (see applyEyeAim/buildEyeAimTarget) -- never
// rendered as face-board dots.
const FACEBOARD_HIDDEN_KEYS = new Set(['|lookAtSwitch', '|rigLogicSwitch', '|convergenceSwitch']);

function buildFaceBoard(rig, container) {
  const { handle, guiBuf, guiCount } = rig;
  const layout = FACEBOARD_LAYOUT;

  // ── Group raw GUI indices into (side, base) widgets with tx/ty indices ──
  const widgets = new Map(); // key "side|base" -> widget
  for (let i = 0; i < guiCount; i++) {
    const full = RL.UTF8ToString(rl_get_gui_control_name(handle, i));
    const { side, base, axis } = splitGuiControlName(full);
    const key = `${side || ''}|${base}`;
    let w = widgets.get(key);
    if (!w) {
      w = { side, base, key, label: `${side ? side + '_' : ''}${base}` };
      widgets.set(key, w);
    }
    if (axis === 'tx') {
      w.txIndex = i; w.txMin = rl_get_gui_control_min(handle, i); w.txMax = rl_get_gui_control_max(handle, i);
      guiBuf[i] = Math.min(Math.max(0, w.txMin), w.txMax);
    }
    if (axis === 'ty') {
      w.tyIndex = i; w.tyMin = rl_get_gui_control_min(handle, i); w.tyMax = rl_get_gui_control_max(handle, i);
      guiBuf[i] = Math.min(Math.max(0, w.tyMin), w.tyMax);
    }
  }
  const widgetList = Array.from(widgets.values());

  // ── Attach each widget's real Blender layout entry from the JSON. Each
  // control also carries a "board" id (1 = main face board, 2 = the
  // secondary "tweakers" board) -- faceboard_layout.json already splits
  // and independently re-normalizes positions per board (see its "boards"
  // key), so the two render as separate, non-overlapping panels below. ──
  const unmatched = [];
  for (const w of widgetList) {
    w.is1D = (w.txIndex === undefined) !== (w.tyIndex === undefined);
    const entry = layout.controls[w.key];
    if (entry) {
      w.entry = entry;
      w.board = entry.board || 1;
    } else {
      unmatched.push(w);
    }
  }
  if (unmatched.length > 0) {
    console.warn(`Face board: ${unmatched.length} control(s) missing from faceboard_layout.json, placing in a fallback corner:`, unmatched.map(w => w.key));
    unmatched.forEach((w, i) => {
      w.board = 1;
      w.entry = w.is1D
        ? (() => {
            const min = w.txIndex !== undefined ? w.txMin : w.tyMin;
            const max = w.txIndex !== undefined ? w.txMax : w.tyMax;
            return { rest: { x: 2, y: 2 + i * 3 }, final: { x: 6, y: 2 + i * 3 }, finalValue: max || min || 1, min, max };
          })()
        : { corners: {
              minmin: { x: 2, y: 2 + i * 3 }, maxmin: { x: 6, y: 2 + i * 3 },
              minmax: { x: 2, y: 5 + i * 3 }, maxmax: { x: 6, y: 5 + i * 3 } },
            minX: w.txMin, maxX: w.txMax, minY: w.tyMin, maxY: w.tyMax };
    });
  }

  // ── Two responsive, full-width panels stacked vertically (page/sidebar
  // scroll handles overflow -- no zoom slider, no horizontal scroll: each
  // panel's own aspect ratio, precomputed from its real Blender content in
  // faceboard_layout.json's "boards", keeps it undistorted at any width. ──
  // FACEBOARD_HIDDEN_KEYS: Blender's native look-at/convergence switches,
  // superseded by this viewer's own draggable eye-aim target -- keep their
  // GUI slots initialized (above) but don't clutter the board with dots
  // for controls this UI no longer drives.
  for (const boardId of [1, 2]) {
    const meta = layout.boards[String(boardId)];
    const boardWidgets = widgetList.filter(w => w.board === boardId && !FACEBOARD_HIDDEN_KEYS.has(w.key));
    if (!meta || boardWidgets.length === 0) continue;
    const panel = document.createElement('div');
    panel.className = 'faceboard-panel';
    panel.style.aspectRatio = String(1 / meta.aspect);
    container.appendChild(panel);
    buildFaceBoardPanel(panel, boardId, meta.aspect, boardWidgets, layout, guiBuf);
  }

  // Reused by applyEyeAim() to write computed x/y directly into the same
  // GUI control slots (index + min/max) this board already resolved.
  rig.eyeAimGuiIndices = new Map(widgetList.map(w => [w.key, w]));

  return widgetList;
}

// Renders one face-board panel (main or tweakers) into `panel`: group boxes,
// labels, range indicators and draggable dots for `boardWidgets`. `aspect`
// is this panel's real height/width ratio (from faceboard_layout.json), and
// is required to correctly compute range-line angles/lengths and 1D drag
// projections in percent-space, since a non-square panel means 1% of width
// and 1% of height are different real pixel distances.
function buildFaceBoardPanel(panel, boardId, aspect, boardWidgets, layout, guiBuf) {
  // Eye ovals -- besides the rectangular group boxes, Blender's tweakers
  // board also draws an oval outline around each eye's cluster of controls
  // (eyelids, eyelashes tweakers, face scrunch). Rendered first (behind
  // everything else, purely decorative/z-index 0).
  for (const o of (layout.eyeOvals || [])) {
    if (o.board !== boardId) continue;
    const ovalEl = document.createElement('div');
    ovalEl.className = 'fb-oval';
    ovalEl.style.left = `${o.minX}%`;
    ovalEl.style.top = `${o.minY}%`;
    ovalEl.style.width = `${o.maxX - o.minX}%`;
    ovalEl.style.height = `${o.maxY - o.minY}%`;
    panel.appendChild(ovalEl);
  }

  // Real group boxes from Blender's face board (e.g. "lip bite", "OH",
  // "mouth suck" containing "lips together"/"mouth press", etc.) -- the
  // actual mesh outlines Blender draws to visually cluster related sliders,
  // extracted as world-space bounding boxes. Rendered first/largest-first
  // so nested boxes draw on top.
  const boxes = (layout.groupBoxes || []).filter(b => b.board === boardId);
  for (const b of boxes) {
    const boxEl = document.createElement('div');
    boxEl.className = 'fb-box';
    boxEl.style.left = `${b.minX}%`;
    boxEl.style.top = `${b.minY}%`;
    boxEl.style.width = `${b.maxX - b.minX}%`;
    boxEl.style.height = `${b.maxY - b.minY}%`;
    panel.appendChild(boxEl);
    if (b.label) {
      const capEl = document.createElement('div');
      capEl.className = 'fb-box-label';
      capEl.textContent = b.label;
      boxEl.appendChild(capEl);
      const panelRect = panel.getBoundingClientRect();
      const capRect = capEl.getBoundingClientRect();
      if (capRect.right > panelRect.right) { capEl.style.left = 'auto'; capEl.style.right = '3px'; }
    }
  }

  // Real group-label captions from Blender's face board -- skip any whose
  // text is already shown as a group box's own caption (see loop above) to
  // avoid rendering the same label twice.
  const boxLabelTexts = new Set(boxes.filter(b => b.label).map(b => b.label.toLowerCase()));
  for (const l of (layout.labels || [])) {
    if (l.board !== boardId || boxLabelTexts.has(l.text.toLowerCase())) continue;
    const el = document.createElement('div');
    el.className = 'fb-label';
    el.textContent = l.text;
    el.style.left = `${l.x}%`;
    el.style.top = `${l.y}%`;
    panel.appendChild(el);
    // Re-anchor away from center if the (nowrap) caption text actually
    // spills past the panel's left/right edge, measured post-layout so it
    // works for any text length -- the panel is full-width/responsive now
    // and must never force horizontal scroll.
    const panelRect = panel.getBoundingClientRect();
    const elRect = el.getBoundingClientRect();
    if (elRect.right > panelRect.right) el.style.transform = 'translate(-100%, -50%)';
    else if (elRect.left < panelRect.left) el.style.transform = 'translate(0, -50%)';
  }

  for (const w of boardWidgets) {
    // Range indicator -- the real extracted rest->final line for 1D
    // controls, or the real extracted min/max box for 2D controls, so the
    // user can see how far a control can travel before dragging it.
    if (w.is1D) {
      // Span the control's FULL [min,max] range, not just rest(0)->final --
      // many controls sit at value 0 in the middle of a two-sided range
      // (e.g. min<0<max) and can be dragged either way from there, so the
      // line must extend on both sides of the rest point. Bone location is
      // linear in the control value, so extrapolating faceboardPos1D out to
      // min/max (beyond the single "final" extreme actually posed in
      // Blender during extraction) is still exact, not a guess.
      const pMin = faceboardPos1D(w.entry, w.entry.min);
      const pMax = faceboardPos1D(w.entry, w.entry.max);
      const dxPct = pMax.x - pMin.x;
      const dyPctReal = (pMax.y - pMin.y) * aspect; // convert to width-%-equivalent units
      const lenPct = Math.hypot(dxPct, dyPctReal);
      const angleDeg = Math.atan2(dyPctReal, dxPct) * 180 / Math.PI;
      const line = document.createElement('div');
      line.className = 'fb-range-line';
      line.style.left = `${pMin.x}%`;
      line.style.top = `${pMin.y}%`;
      line.style.width = `${lenPct}%`;
      line.style.transform = `rotate(${angleDeg}deg)`;
      panel.appendChild(line);
    } else {
      const c = w.entry.corners;
      const bx0 = Math.min(c.minmin.x, c.maxmin.x, c.minmax.x, c.maxmax.x);
      const bx1 = Math.max(c.minmin.x, c.maxmin.x, c.minmax.x, c.maxmax.x);
      const by0 = Math.min(c.minmin.y, c.maxmin.y, c.minmax.y, c.maxmax.y);
      const by1 = Math.max(c.minmin.y, c.maxmin.y, c.minmax.y, c.maxmax.y);
      const rb = document.createElement('div');
      rb.className = 'fb-range-box';
      rb.style.left = `${bx0}%`;
      rb.style.top = `${by0}%`;
      rb.style.width = `${bx1 - bx0}%`;
      rb.style.height = `${by1 - by0}%`;
      panel.appendChild(rb);
    }

    const dot = document.createElement('div');
    dot.className = 'fb-dot' + (w.is1D ? ' fb-1d' : '');
    dot.dataset.label = w.label;
    panel.appendChild(dot);

    const applyDotPosition = () => {
      let pos;
      if (w.is1D) {
        const value = w.txIndex !== undefined ? guiBuf[w.txIndex] : guiBuf[w.tyIndex];
        pos = faceboardPos1D(w.entry, value);
      } else {
        const tx = w.txIndex !== undefined ? guiBuf[w.txIndex] : 0;
        const ty = w.tyIndex !== undefined ? guiBuf[w.tyIndex] : 0;
        pos = faceboardPos2D(w.entry, tx, ty);
      }
      dot.style.left = `${pos.x}%`;
      dot.style.top = `${pos.y}%`;
    };
    applyDotPosition();

    let dragging = false;
    let startClientX = 0, startClientY = 0;
    let startTx = 0, startTy = 0;

    dot.addEventListener('pointerdown', (e) => {
      dragging = true;
      try { dot.setPointerCapture(e.pointerId); } catch (err) { /* no active pointer to capture */ }
      startClientX = e.clientX; startClientY = e.clientY;
      startTx = w.txIndex !== undefined ? guiBuf[w.txIndex] : 0;
      startTy = w.tyIndex !== undefined ? guiBuf[w.tyIndex] : 0;
      dot.classList.add('fb-active');
      orbit.enabled = false;
      e.stopPropagation();
    });
    dot.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      // Convert the mouse delta into panel percent-space via the panel's
      // actual rendered size, so dragging stays correct at any responsive
      // width/height the panel happens to be laid out at.
      const rect = panel.getBoundingClientRect();
      const dxPct = (e.clientX - startClientX) / rect.width * 100;
      const dyPct = (e.clientY - startClientY) / rect.height * 100;

      if (w.is1D) {
        // Project the mouse delta onto the control's real drag axis -- the
        // exact rest->final vector extracted from Blender, not a guessed
        // horizontal/vertical/diagonal direction. Both vectors are
        // converted to a common width-%-equivalent scale (via `aspect`)
        // before the dot product, since raw x-% and y-% are different real
        // pixel scales on a non-square panel.
        const axisX = w.entry.final.x - w.entry.rest.x;
        const axisYReal = (w.entry.final.y - w.entry.rest.y) * aspect;
        const dyPctReal = dyPct * aspect;
        const axisLenSq = axisX * axisX + axisYReal * axisYReal;
        const proj = axisLenSq > 1e-9 ? (dxPct * axisX + dyPctReal * axisYReal) / axisLenSq : 0;
        const deltaValue = proj * w.entry.finalValue;
        if (w.txIndex !== undefined) {
          guiBuf[w.txIndex] = Math.min(w.txMax, Math.max(w.txMin, startTx + deltaValue));
        } else {
          guiBuf[w.tyIndex] = Math.min(w.tyMax, Math.max(w.tyMin, startTy + deltaValue));
        }
      } else {
        // Independent per-axis mapping using the real corner geometry (see
        // faceboardPos2D) -- handles boxes whose screen axes run opposite
        // to their control axes (e.g. R|mouth_corner) automatically. No
        // aspect correction needed: x-% and y-% are used independently.
        if (w.txIndex !== undefined) {
          const spanX = w.entry.corners.maxmin.x - w.entry.corners.minmin.x;
          const deltaTx = Math.abs(spanX) > 1e-9 ? dxPct / spanX * (w.entry.maxX - w.entry.minX) : 0;
          guiBuf[w.txIndex] = Math.min(w.txMax, Math.max(w.txMin, startTx + deltaTx));
        }
        if (w.tyIndex !== undefined) {
          const spanY = w.entry.corners.minmax.y - w.entry.corners.minmin.y;
          const deltaTy = Math.abs(spanY) > 1e-9 ? dyPct / spanY * (w.entry.maxY - w.entry.minY) : 0;
          guiBuf[w.tyIndex] = Math.min(w.tyMax, Math.max(w.tyMin, startTy + deltaTy));
        }
      }
      applyDotPosition();
      dirty = true;
    });
    const endDrag = (e) => {
      if (!dragging) return;
      dragging = false;
      try { dot.releasePointerCapture(e.pointerId); } catch (err) { /* already released */ }
      dot.classList.remove('fb-active');
      orbit.enabled = true;
    };
    dot.addEventListener('pointerup', endDrag);
    dot.addEventListener('pointercancel', endDrag);
  }
}

// Draggable 3D target the eyes look at (ports rig_instance.py's eye-aim
// system -- see applyEyeAim). Defaults near where Blender's own
// position_eye_aim() places it: eye-center + a bit in front of the face.
function buildEyeAimTarget(rig) {
  const geo = new THREE.SphereGeometry(0.012, 12, 12);
  const mat = new THREE.MeshBasicMaterial({ color: 0xff3366, transparent: true, opacity: 0.85 });
  const target = new THREE.Mesh(geo, mat);
  target.visible = false;

  const eyeL = rig.boneByName.get('FACIAL_L_Eye');
  const eyeR = rig.boneByName.get('FACIAL_R_Eye');
  const center = new THREE.Vector3();
  if (eyeL && eyeR) {
    rig.rootBone.updateMatrixWorld(true);
    const pL = eyeL.getWorldPosition(new THREE.Vector3());
    const pR = eyeR.getWorldPosition(new THREE.Vector3());
    center.addVectors(pL, pR).multiplyScalar(0.5);
    center.z += 0.35; // "in front of the face" -- eyes look forward along +Z here
  }
  target.position.copy(center);
  scene.add(target);
  rig.eyeAimTarget = target;

  // Simple drag: on pointerdown over the sphere, move it on a plane facing
  // the camera at its current depth, following the mouse until pointerup.
  let dragging = false;
  const dragPlane = new THREE.Plane();
  const raycaster = new THREE.Raycaster();
  const hitPoint = new THREE.Vector3();

  const toNDC = (e) => {
    const rect = renderer.domElement.getBoundingClientRect();
    return new THREE.Vector2(
      ((e.clientX - rect.left) / rect.width) * 2 - 1,
      -((e.clientY - rect.top) / rect.height) * 2 + 1
    );
  };

  renderer.domElement.addEventListener('pointerdown', (e) => {
    if (!target.visible) return;
    const ndc = toNDC(e);
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObject(target, false);
    if (hits.length === 0) return;
    dragging = true;
    orbit.enabled = false;
    camera.getWorldDirection(dragPlane.normal);
    dragPlane.setFromNormalAndCoplanarPoint(dragPlane.normal, target.position);
    e.stopPropagation();
  });
  renderer.domElement.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const ndc = toNDC(e);
    raycaster.setFromCamera(ndc, camera);
    if (raycaster.ray.intersectPlane(dragPlane, hitPoint)) {
      target.position.copy(hitPoint);
      dirty = true;
    }
  });
  const endDrag = () => { if (dragging) { dragging = false; orbit.enabled = true; } };
  renderer.domElement.addEventListener('pointerup', endDrag);
  renderer.domElement.addEventListener('pointercancel', endDrag);

  return target;
}

// ════════════════════════════════════════════════════════════
//  GUI
// ════════════════════════════════════════════════════════════
// Builds the flat, alphabetical slider list (one row per raw GUI control
// index) into `container`. Used as the collapsed "advanced" fallback under
// the face board, and as the only view for rigs with no face-board layout
// (currently just the body rig, which has 0 GUI controls in this DNA).
function buildFlatGUIList(rig, container) {
  const { handle, guiBuf, guiCount } = rig;
  for (let i = 0; i < guiCount; i++) {
    const name = RL.UTF8ToString(rl_get_gui_control_name(handle, i));
    const row  = document.createElement('div');
    row.className = 'ctrl';
    const lbl = document.createElement('label');
    lbl.title = name; lbl.textContent = name;
    const slider = document.createElement('input');
    const min = rl_get_gui_control_min(rig.handle, i);
    const max = rl_get_gui_control_max(rig.handle, i);
    // Idempotent with buildFaceBoard's own clamp -- recomputing the same
    // formula for an index the face board already initialized is a no-op.
    const initial = Math.min(Math.max(0, min), max);
    guiBuf[i] = initial;
    slider.type = 'range'; slider.min = min; slider.max = max;
    slider.step = 0.01; slider.value = initial;
    const valSpan = document.createElement('span');
    valSpan.textContent = Number(initial).toFixed(2);
    slider.addEventListener('input', () => {
      guiBuf[i] = parseFloat(slider.value);
      valSpan.textContent = Number(slider.value).toFixed(2);
      dirty = true;
    });
    row.append(lbl, slider, valSpan);
    container.appendChild(row);
  }
}

function buildGUI(rig, containerId, { faceBoard = false } = {}) {
  const { guiCount } = rig;
  if (guiCount === 0) return;
  const container = document.getElementById(containerId);
  const h = document.createElement('h3');
  h.textContent = `${rig.label.toUpperCase()} — ${guiCount} controls`;
  container.appendChild(h);

  if (faceBoard) {
    buildFaceBoard(rig, container);
    const details = document.createElement('details');
    details.className = 'fb-advanced';
    const summary = document.createElement('summary');
    summary.textContent = `Advanced: all ${guiCount} controls (flat list)`;
    details.appendChild(summary);
    buildFlatGUIList(rig, details);
    container.appendChild(details);
  } else {
    buildFlatGUIList(rig, container);
  }
}

buildGUI(headRig, 'ctrl-head', { faceBoard: true });
buildGUI(bodyRig, 'ctrl-body');

// ── Eye aim toggle ─────────────────────────────────────────────────────
{
  const eyeAimTarget = buildEyeAimTarget(headRig);
  const headContainer = document.getElementById('ctrl-head');
  const row = document.createElement('div');
  row.className = 'ctrl';
  row.style.marginBottom = '8px';
  const label = document.createElement('label');
  label.textContent = 'Eye aim (drag red dot)';
  label.style.cursor = 'pointer';
  const checkbox = document.createElement('input');
  checkbox.type = 'checkbox';
  checkbox.addEventListener('change', () => {
    eyeAimTarget.visible = checkbox.checked;
    dirty = true;
  });
  row.appendChild(checkbox);
  row.appendChild(label);
  headContainer.insertBefore(row, headContainer.firstChild);
}

window.headRig = headRig;
window.bodyRig = bodyRig;
window.__evaluate = evaluate;
window.__transformControls = transformControls;
window.__syncHeadToBody = syncHeadToBody;
window.__dumpAnimatedMapNames = (rig) => {
  const n = rl_get_animated_map_count(rig.handle);
  const names = [];
  for (let i = 0; i < n; i++) names.push(RL.UTF8ToString(rl_get_animated_map_name(rig.handle, i)));
  return names;
};
window.__getSelection = () => selection;
window.__selectBone = selectBone;

// ════════════════════════════════════════════════════════════
//  RENDER LOOP
// ════════════════════════════════════════════════════════════
setMsg('Ready', 100);
document.getElementById('loading').style.display = 'none';

let dirty = true;
let frames = 0, t0 = performance.now();

function animate() {
  requestAnimationFrame(animate);
  orbit.update();
  if (dirty) {
    evaluate(headRig);
    evaluate(bodyRig);
    // syncHeadToBody() is intentionally NOT called: head.dna and body.dna's
    // neutral poses are already coordinate-aligned natively (verified by
    // inspecting the real rig in Blender -- head.dna's own spine_04 rest
    // position matches body.dna's to 6 decimal places with no runtime
    // constraint applied). Calling it visibly breaks head placement here
    // (confirmed empirically: identical numeric bone position/rotation
    // targets, yet the rendered head ends up detached/misrotated) for a
    // reason not fully root-caused -- likely a quaternion-sign or bind-time
    // vs runtime skinning mismatch specific to this Three.js/Y-up port.
    // Known limitation: without this sync, head.dna's own copy of shared
    // upper-body bones (clavicle/upperarm/spine) will NOT follow if the body
    // is posed away from neutral via the gizmo -- acceptable for now since
    // head_lod0_mesh isn't skinned to those bones; only neck_01/neck_02/head
    // (which head_lod0_mesh IS skinned to, and which are also head's own
    // driver bones) would matter, and posing those directly on the head
    // rig itself remains unaffected.
    dirty = false;
  }
  renderer.render(scene, camera);
  if (++frames >= 60) {
    const fps = (frames / ((performance.now() - t0) / 1000)).toFixed(0);
    setStatus(`${fps} fps  |  head: ${headRig.jointCount}j ${headRig.blendCount}bs  |  body: ${bodyRig.jointCount}j ${bodyRig.blendCount}bs`);
    frames = 0; t0 = performance.now();
  }
}
animate();
</script>
